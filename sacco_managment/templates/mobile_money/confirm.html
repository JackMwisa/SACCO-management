<!-- mobile_money/confirm.html -->
{% extends "partials/dashboard-base.html" %}
{% load humanize %}

{% block content %}
<section class="dashboard-section body-collapse pay step step-2">
  <div class="overlay pt-120">
    <div class="container-fruid">
      <div class="main-content">
        <div class="payment-confirmation">
          <div class="verification-badge mb-4">
            <i class="fas fa-check-circle text-success fa-4x"></i>
            <h4 class="mt-3">Number Verified</h4>
          </div>
          
          <div class="verified-details card mb-4">
            <div class="card-body">
              <div class="detail-item">
                <span>Phone Number:</span>
                <strong>{{ verified_data.phone }}</strong>
              </div>
              <div class="detail-item">
                <span>Registered Name:</span>
                <strong>{{ verified_data.name }}</strong>
              </div>
              <div class="detail-item">
                <span>Network:</span>
                <strong>{{ verified_data.provider }}</strong>
              </div>
            </div>
          </div>
          
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Amount to Deposit (UGX)</label>
              <input type="number" name="amount" class="form-control" 
                     min="1000" max="5000000" step="1000" required>
            </div>
            
            <div class="d-flex justify-content-between">
              <a href="{% url 'core:mobile-money-deposit' %}" class="btn btn-secondary">
                Back
              </a>
              <button type="submit" class="btn btn-primary">
                Confirm and Pay
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
